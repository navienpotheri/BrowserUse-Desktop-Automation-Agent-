[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browseruse-desktop-agent"
version = "0.1.0"
description = "A model-neutral benchmark harness for browser and desktop agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browsergym = ["browsergym-miniwob", "Pillow>=10"]
workarena = ["browsergym-workarena"]
webarena = ["browsergym-webarena"]

[tool.setuptools.packages.find]
where = ["src"]
