[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browseruse-desktop-agent"
version = "0.1.0"
description = "A model-neutral benchmark harness for browser and desktop agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browsergym = [
  "browsergym-workarena",
  "browsergym-miniwob",
  "browsergym-webarena",
  "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]
